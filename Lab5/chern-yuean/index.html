<style>
/* Single light theme by choice (matches the first draft the user liked).
   Layout: full-bleed MapLibre map; one Liquid-Glass side panel (desktop/iPad) that becomes a bottom sheet on phones; glass popups anchored to pins. */
:root{
  --bg:#e9eff1; --map-land:#f3f5f2; --map-ns:#fbfbf7; --map-other:#e4e9e7; --map-line:#b8c4c9; --map-ns-line:#d0577f;
  --map-water:#86c3e6; --map-water-edge:#5fa7d3; --map-road:#ffffff; --map-road-edge:#c9d2d6; --map-rail:#8a979f;
  --ink:#0f1d26; --ink-2:#465863; --ink-3:#7a8a94;
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.82); --glass-line:rgba(255,255,255,.8); --shade:rgba(20,40,60,.18);
  --chip:rgba(15,29,38,.06); --accent:#d0457a; --accent-ink:#fff;
  --c-food:#e8772e; --c-mu:#c99a06; --c-nature:#2f9e5b; --c-view:#2b7fd0; --c-history:#8a5bd1;
  --tt:#111; --tt-ink:#fff;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai","Thonburi","Leelawadee UI",system-ui,sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 18px 50px -14px var(--shade),0 2px 6px -2px var(--shade)}

#app{position:relative;height:100%}
#map{position:absolute;inset:0}

/* ---------- side panel ---------- */
.panel{position:absolute;left:16px;top:16px;bottom:16px;width:392px;border-radius:var(--r-xl);display:flex;flex-direction:column;overflow:hidden;z-index:5}
.p-head{padding:16px 18px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--accent),#ff9a6b);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45);flex:none}

$("q").addEventListener("input",e=>{query=e.target.value;if(tab!=="list"&&tab!=="dash")setTab("list");else renderBody();recluster()});
$("q").addEventListener("focus",()=>{if(innerWidth<=760)setSheet("full")});
function setSheet(s){const p=$("panel");p.classList.remove("mini","full");if(s)p.classList.add(s)}
$("handle").onclick=()=>{const p=$("panel");setSheet(p.classList.contains("full")?"mini":p.classList.contains("mini")?"":"full")};
$("bIn").onclick=()=>map.zoomIn();$("bOut").onclick=()=>map.zoomOut();$("bHome").onclick=()=>map.fitBounds(TH,{padding:padding(),duration:800});
$("bLayers").onclick=()=>{const L=$("layers");L.hidden=!L.hidden;$("bLayers").setAttribute("aria-expanded",!L.hidden)};
$("lyAds").onchange=recluster;$("lyNS").onchange=recluster;
$("bLocate").onclick=()=>{if(!navigator.geolocation){toast("อุปกรณ์นี้ไม่รองรับการระบุตำแหน่ง");return}
 navigator.geolocation.getCurrentPosition(pos=>{userLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};const e=document.createElement("div");e.style.cssText="width:18px;height:18px;border-radius:50%;background:#2b7fd0;border:3px solid #fff;box-shadow:0 0 0 8px rgba(43,127,208,.25)";new maplibregl.Marker({element:e}).setLngLat([userLoc.lng,userLoc.lat]).addTo(map);map.easeTo({center:[userLoc.lng,userLoc.lat],zoom:7});setTab("list");toast("เรียงแหล่งอันซีนจากใกล้ไปไกลแล้ว")},
 ()=>toast("ใช้ตำแหน่งไม่ได้ในหน้านี้ เปิดแอปจากเว็บที่โฮสต์เองแล้วอนุญาตตำแหน่ง"),{enableHighAccuracy:false,timeout:8000})};
/* ---- basemap: vector (default) / satellite / street ---- */
const BASES={
 sat:[{t:"https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg",max:15,a:"ภาพดาวเทียม Sentinel-2 cloudless 2020 © EOX IT Services GmbH (contains modified Copernicus Sentinel data 2020)"},
      {t:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",max:18,a:"ภาพดาวเทียม © Esri, Maxar, Earthstar Geographics"}],
 street:[{t:"https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png",max:19,a:"© OpenStreetMap contributors © CARTO"}]};
const okTiles={};
function probe(src){return new Promise(r=>{const i=new Image();let done=false;const fin=v=>{if(!done){done=true;r(v)}};i.onload=()=>fin(true);i.onerror=()=>fin(false);setTimeout(()=>fin(false),3500);i.src=src.t.replace("{z}","6").replace("{y}","29").replace("{x}","50")})}
async function pick(kind){if(okTiles[kind]!==undefined)return okTiles[kind];for(const s of BASES[kind]){if(await probe(s)){okTiles[kind]=s;return s}}okTiles[kind]=null;return null}
let baseMode="map";
async function setBase(mode,quiet){const src=mode==="map"?null:await pick(mode);
 if(mode!=="map"&&!src){if(!quiet)toast("โหลดภาพแผนที่จากภายนอกไม่ได้ในหน้านี้ เปิดจากเว็บที่โฮสต์เองเพื่อดูภาพดาวเทียม");return}
 baseMode=mode;document.querySelectorAll("#baseSeg button").forEach(b=>b.classList.toggle("on",b.dataset.b===mode));
 if(map.getLayer("rbase"))map.removeLayer("rbase");if(map.getSource("rbase"))map.removeSource("rbase");
 if(src){map.addSource("rbase",{type:"raster",tiles:[src.t],tileSize:256,maxzoom:src.max,attribution:src.a});map.addLayer({id:"rbase",type:"raster",source:"rbase"},"prov")}
 const sat=mode!=="map";document.getElementById("app").classList.toggle("sat",mode==="sat");
 map.setPaintProperty("bg","background-color",sat?"#1c2a33":css("--map-sea"));
 map.setPaintProperty("country","fill-opacity",sat?0:1);
 map.setPaintProperty("prov","fill-opacity",sat?["case",["get","ns"],.14,0]:1);
 map.setPaintProperty("prov-line","line-color",mode==="sat"?"rgba(255,255,255,.55)":css("--map-line"));
 map.setPaintProperty("lake","fill-opacity",sat?0:1);map.setPaintProperty("river","line-opacity",sat?0:1);
 $("baseNote").textContent=src?src.a:"แผนที่แบบเวกเตอร์ในตัวแอป ใช้ได้ทุกที่ ดาวเทียมและถนนต้องเปิดจากเว็บที่โฮสต์เอง"}
document.querySelectorAll("#baseSeg button").forEach(b=>b.onclick=()=>setBase(b.dataset.b));
map.on("load",()=>setBase("sat",true)); /* uses satellite automatically when the host allows external imagery */
map.on("error",()=>{});
let tt;function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),3800)}
map.on("click",()=>{if(innerWidth<=760&&$("panel").classList.contains("mini"))setSheet("")});
addEventListener("hashchange",()=>{const id=location.hash.slice(1).replace(/^p-/,"");if(pins[id])open(id,true)});
renderChips();renderBody();
})();
</script>
